<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1E1B4B"/>
      <stop offset="0.5" stop-color="#312E81"/>
      <stop offset="1" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="logo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#312E81"/>
      <stop offset="1" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.07"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- subtle grid -->
  <g stroke="#ffffff" stroke-opacity="0.05" stroke-width="1">
    <path d="M0 90 H1200 M0 180 H1200 M0 270 H1200 M0 360 H1200 M0 450 H1200 M0 540 H1200"/>
    <path d="M150 0 V630 M300 0 V630 M450 0 V630 M600 0 V630 M750 0 V630 M900 0 V630 M1050 0 V630"/>
  </g>

  <!-- logo -->
  <rect x="80" y="210" width="120" height="120" rx="28" fill="url(#logo)"/>
  <polygon points="122,235 84,277 108,277 100,325 138,277 114,277" fill="#FACC15"/>

  <!-- wordmark -->
  <text x="228" y="272" font-family="Helvetica, Arial, sans-serif" font-size="92" font-weight="800" fill="#FFFFFF" letter-spacing="-2">Super</text>
  <text x="228" y="362" font-family="Helvetica, Arial, sans-serif" font-size="92" font-weight="800" fill="#FACC15" letter-spacing="-2">Calculator</text>

  <!-- divider -->
  <line x1="82" y1="404" x2="740" y2="404" stroke="#ffffff" stroke-opacity="0.25" stroke-width="2"/>

  <!-- tagline -->
  <text x="82" y="452" font-family="Helvetica, Arial, sans-serif" font-size="30" font-weight="400" fill="#C7CCF5">Free online calculators for finance, health, math &amp; more</text>

  <!-- pills -->
  <g font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="600" fill="#EEF1FF">
    <rect x="82" y="486" width="150" height="48" rx="24" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.2"/>
    <text x="157" y="517" text-anchor="middle">Finance</text>
    <rect x="246" y="486" width="150" height="48" rx="24" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.2"/>
    <text x="321" y="517" text-anchor="middle">Fitness</text>
    <rect x="410" y="486" width="130" height="48" rx="24" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.2"/>
    <text x="475" y="517" text-anchor="middle">Math</text>
    <rect x="554" y="486" width="150" height="48" rx="24" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.2"/>
    <text x="629" y="517" text-anchor="middle">&amp; More</text>
  </g>

  <!-- right stat cards -->
  <g font-family="Helvetica, Arial, sans-serif" text-anchor="middle">
    <rect x="838" y="120" width="282" height="120" rx="20" fill="url(#card)" stroke="#ffffff" stroke-opacity="0.16"/>
    <text x="979" y="192" font-size="56" font-weight="800" fill="#FFFFFF">160+</text>
    <text x="979" y="222" font-size="22" font-weight="500" fill="#B9BFEA">Calculators</text>

    <rect x="838" y="256" width="282" height="120" rx="20" fill="url(#card)" stroke="#ffffff" stroke-opacity="0.16"/>
    <text x="979" y="328" font-size="52" font-weight="800" fill="#34D399">Free</text>
    <text x="979" y="358" font-size="22" font-weight="500" fill="#B9BFEA">No sign-up needed</text>

    <rect x="838" y="392" width="282" height="120" rx="20" fill="url(#card)" stroke="#ffffff" stroke-opacity="0.16"/>
    <text x="979" y="464" font-size="52" font-weight="800" fill="#FACC15">Fast</text>
    <text x="979" y="494" font-size="22" font-weight="500" fill="#B9BFEA">Instant results</text>
  </g>

  <!-- domain -->
  <text x="1120" y="560" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#AEB5E4">supercalculator.xyz</text>
</svg>
